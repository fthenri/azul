services:
  frontend:
    build: 
      context: ./front
      dockerfile: Dockerfile
    container_name: azul_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./front:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - WATCHPACK_POLLING=true
    depends_on:
      - backend

  backend:
    build: 
      context: ./back
      dockerfile: Dockerfile
    container_name: azul_backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./back:/app/back
      - ./data_lake:/app/data_lake
      - ./regras_azul_fidelidade.md:/app/regras_azul_fidelidade.md
    environment:
      - ENVIRONMENT=dev
      - HOST=0.0.0.0
      - PORT=8000
