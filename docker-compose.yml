version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: azul_db
    environment:
      POSTGRES_USER: azul_user
      POSTGRES_PASSWORD: azul_password
      POSTGRES_DB: azul_crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: 
      context: ./back
    container_name: azul_backend
    ports:
      - "8000:8000"
    volumes:
      - ./back:/app
      - ./data_lake:/app/data_lake  # Mapeamento do Data Lake para o backend ler os Parquets
    environment:
      - DATABASE_URL=postgresql://azul_user:azul_password@db:5432/azul_crm
    depends_on:
      - db

  frontend:
    build: 
      context: ./front
    container_name: azul_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./front:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000

volumes:
  postgres_data:

